services:
  postgres:
    # TODO: pin this image by digest.
    image: postgres:16
    environment:
      POSTGRES_USER: affidavit
      POSTGRES_DB: affidavit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
