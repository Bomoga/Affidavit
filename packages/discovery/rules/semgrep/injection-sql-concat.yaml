# Affidavit's own rules. Written from scratch; no registry rule or rule text is used or copied.
# One rule per file, so each rule has its own test file in ../tests with the same base name.
rules:
  - id: affidavit.injection.sql-concat
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A SQL statement is built by string concatenation or template interpolation and passed to a
      query method. Values placed in the text of a statement are not parameters; pass them as
      bound parameters instead. This is a pattern-level rule: it does not prove the value is
      attacker controlled.
    metadata:
      cls: injection
      cwe: CWE-89
      confidence: medium
      note: >-
        Does not follow data across files or through variables (the taint rule does); the
        arraignment stage decides reachability. Known false positives: a constant table or column
        name interpolated from a non-literal variable, and a value validated elsewhere.
    patterns:
      - pattern-either:
          # Statement as the first argument, on a client, pool, connection or builder.
          - pattern: $DB.$M(`...${$X}...`, ...)
          - pattern: $DB.$M($A + $X, ...)
          - pattern: $DB.$M($X + $A, ...)
          # A bare call, for example a destructured query function.
          - pattern: $M(`...${$X}...`, ...)
          - pattern: $M($A + $X, ...)
          - pattern: $M($X + $A, ...)
          # Option objects: query({ sql: ... }) and query({ text: ... }).
          - pattern: '$DB.$M({ sql: `...${$X}...`, ... }, ...)'
          - pattern: '$DB.$M({ sql: $A + $X, ... }, ...)'
          - pattern: '$DB.$M({ sql: $X + $A, ... }, ...)'
          - pattern: '$DB.$M({ text: `...${$X}...`, ... }, ...)'
          - pattern: '$DB.$M({ text: $A + $X, ... }, ...)'
          - pattern: '$DB.$M({ text: $X + $A, ... }, ...)'
      - metavariable-regex:
          metavariable: $M
          regex: ^(query|execute|raw|queryRaw|\$queryRawUnsafe|\$executeRawUnsafe|unsafe|whereRaw|orderByRaw|havingRaw|joinRaw)$
      # A value coerced to a number, a number, or a string literal cannot carry SQL.
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-not: parseInt(...)
            - pattern-not: parseFloat(...)
            - pattern-not: Number(...)
            - pattern-not: '"..."'
      - metavariable-regex:
          metavariable: $X
          regex: ^(?![0-9]+(\.[0-9]+)?$)
      - pattern-not-inside: |
          $X = parseInt(...);
          ...
      - pattern-not-inside: |
          $X = Number(...);
          ...
