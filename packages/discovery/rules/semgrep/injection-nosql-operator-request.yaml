# Affidavit's own rules. Written from scratch; no registry rule or rule text is used or copied.
rules:
  - id: affidavit.injection.nosql-operator-request
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A request value reaches a MongoDB query filter in this file as a whole object or as a field
      value. A JSON or extended query string body can make that value an operator object such as
      {"$ne": null}. Coerce it to a string (String(...)) or validate its type first.
    metadata:
      cls: injection
      cwe: CWE-943
      confidence: medium
      note: Intra-file only. A value that crosses a file boundary before the query is not seen.
    mode: taint
    pattern-sources:
      - pattern: $REQ.body
      - pattern: $REQ.query
      - pattern: $REQ.params
    pattern-sanitizers:
      - pattern: String(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
      - pattern: Boolean(...)
    pattern-sinks:
      - patterns:
          - pattern: $COL.$M($Q, ...)
          - focus-metavariable: $Q
          - metavariable-regex:
              metavariable: $M
              regex: ^(find|findOne|findOneAndUpdate|findOneAndDelete|updateOne|updateMany|deleteOne|deleteMany|countDocuments|remove)$
