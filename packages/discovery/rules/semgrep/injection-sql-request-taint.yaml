# Affidavit's own rules. Written from scratch; no registry rule or rule text is used or copied.
rules:
  - id: affidavit.injection.sql-request-taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A request value (req.body, req.query, req.params, req.headers or req.cookies) flows into the
      first argument of a query call (query, execute, raw, whereRaw and similar) in this file,
      directly or through variables, without a numeric coercion. Use bound parameters.
    metadata:
      cls: injection
      cwe: CWE-89
      confidence: high
      note: >-
        Intra-file only. A value that crosses a file boundary before the query is not seen. A
        request value passed whole as the statement is also reported.
    mode: taint
    pattern-sources:
      - pattern: $REQ.body
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
    pattern-sanitizers:
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              # The statement itself (not an option object, whose values field holds bound values).
              - patterns:
                  - pattern: $DB.$M($Q, ...)
                  - pattern-not: $DB.$M({ ... }, ...)
              # A bare call, for example a destructured query function.
              - patterns:
                  - pattern: $M($Q, ...)
                  - pattern-not: $M({ ... }, ...)
              # Option objects: query({ sql: ... }) and query({ text: ... }).
              - pattern: '$DB.$M({ sql: $Q, ... }, ...)'
              - pattern: '$DB.$M({ text: $Q, ... }, ...)'
          - focus-metavariable: $Q
          - metavariable-regex:
              metavariable: $M
              # Sequelize.literal(...) is a sink too. The TypeORM query builder (where, andWhere,
              # orderBy) is not: it also takes an object of bound values, so a request object
              # passed to it is not injection. Known miss: a request value built into a template
              # and passed to those builder calls through a variable.
              regex: ^(query|execute|raw|queryRaw|\$queryRawUnsafe|\$executeRawUnsafe|unsafe|whereRaw|orderByRaw|havingRaw|joinRaw|literal)$
